# Runs the off-target diagnostics checks on every push: the ODX description is
# validated, the ISO 14229 conformance suite runs, and the UDS sequence is
# exercised once over the virtual CAN bus. The firmware itself is not built here
# - its HAL/CMSIS Drivers are generated by STM32CubeIDE from the .ioc files and
# are not in the repo, so a from-clone compile is not reproducible on CI.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt odxtools

      - name: ODX - structural check (unique IDs, resolvable references)
        run: python diagnostics/odx/validate_refs.py diagnostics/odx/SecureBootloader.odx-d

      - name: ODX - schema check with odxtools
        run: python -m odxtools list diagnostics/odx/SecureBootloader.odx-d --services

      - name: UDS conformance suite
        working-directory: tests
        run: pytest -v --html=report.html --self-contained-html

      - name: UDS sequence over the virtual CAN bus
        working-directory: tests
        run: python uds_bus_sim.py

      - name: Upload conformance report
        if: always()          # keep the report even when a test fails
        uses: actions/upload-artifact@v4
        with:
          name: uds-conformance-report
          path: tests/report.html
