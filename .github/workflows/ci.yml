# Runs on every push. Two jobs:
#   firmware     - compiles all four firmware projects with arm-none-eabi-gcc
#                  (HAL/CMSIS are committed, so a clean clone builds) and keeps
#                  the .bin files as a build artifact.
#   emulator     - boots the real Boot Manager + FBL in Renode and drives them
#                  with the real host tool (signed install, anti-rollback, tamper).
#   diagnostics  - off-target checks: ODX validation, the UDS conformance
#                  suite (against the host model) and one run over a virtual
#                  CAN bus.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi cmake ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake

      - name: Build
        run: cmake --build build

      - name: Upload firmware binaries
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bins
          path: build/*.bin

  emulator:
    runs-on: ubuntu-latest
    env:
      RENODE_VERSION: "1.17.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi cmake ninja-build

      - name: Cache Renode
        id: renode-cache
        uses: actions/cache@v4
        with:
          path: ~/renode
          key: renode-${{ env.RENODE_VERSION }}-linux

      - name: Install Renode
        if: steps.renode-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/renode
          curl -sL https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable.tar.gz             | tar xz -C ~/renode --strip-components=1

      - name: Build firmware with the published TEST keys
        run: |
          cmake -S . -B build-test -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake -DBL_TEST_KEYS=ON
          cmake --build build-test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest pynacl pyserial

      - name: Run the real firmware in Renode
        env:
          RENODE_PATH: ${{ github.workspace }}/../../../renode/renode
        run: |
          export RENODE_PATH="$HOME/renode/renode"
          python -m pytest tests/renode -v

  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt odxtools

      - name: ODX - structural check (unique IDs, resolvable references)
        run: python diagnostics/odx/validate_refs.py diagnostics/odx/SecureBootloader.odx-d

      - name: ODX - schema check with odxtools
        run: python -m odxtools list diagnostics/odx/SecureBootloader.odx-d --services

      - name: UDS conformance suite
        working-directory: tests
        run: pytest -v --html=report.html --self-contained-html

      - name: UDS sequence over the virtual CAN bus
        working-directory: tests
        run: python uds_bus_sim.py

      - name: Upload conformance report
        if: always()          # keep the report even when a test fails
        uses: actions/upload-artifact@v4
        with:
          name: uds-conformance-report
          path: tests/report.html
