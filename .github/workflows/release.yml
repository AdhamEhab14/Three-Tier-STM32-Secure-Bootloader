# Continuous delivery: pushing a version tag (e.g. v1.0.0) re-runs the validation
# gate and then publishes a GitHub Release with the conformance report, the ODX
# description, and a CAN capture attached. If any check fails the release is not
# created, so a tag only ships when everything is green.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write        # needed to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt odxtools

      - name: Validate the ODX description
        run: |
          python diagnostics/odx/validate_refs.py diagnostics/odx/SecureBootloader.odx-d
          python -m odxtools list diagnostics/odx/SecureBootloader.odx-d --services

      - name: Run the conformance + fuzz suite
        working-directory: tests
        run: pytest --html=report.html --self-contained-html

      - name: Generate the CAN capture
        working-directory: tests
        run: python uds_bus_sim.py --log

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            tests/report.html
            tests/uds_trace.log
            diagnostics/odx/SecureBootloader.odx-d
